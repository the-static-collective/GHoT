name: GHoT 002 — actually acquire public evidence, measure physical HTTP cost

on:
  pull_request:
    paths:
      - "ghot/network_inquiry.py"
      - "ghot/test_network_inquiry.py"
      - "docs/NETWORK-INQUIRY-002.md"
      - ".github/workflows/network-inquiry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded query and adversarial synthetic source records
        run: python3 -m unittest discover -s ghot -p "test_network_inquiry.py" -v

  real-public-source:
    runs-on: ubuntu-latest
    needs: offline-adversarial
    timeout-minutes: 7
    continue-on-error: true # public USGS may be unavailable; interpret receipt before claiming useful observation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Three bounded real public read-only USGS questions with resource receipts
        run: python3 ghot/network_inquiry.py --out ghot-002-network-witness.json
      - name: Preserve time, byte, source availability and explicit unknown energy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghot-002-physical-network-witness
          path: ghot-002-network-witness.json
          if-no-files-found: warn
          retention-days: 30
