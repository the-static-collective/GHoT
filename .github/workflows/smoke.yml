name: GHoT smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      - name: Compile all Python modules
        run: python3 -m py_compile ghot/*.py

      - name: Phase 0 local body
        run: |
          python3 ghot/reference_node.py probe
          python3 ghot/reference_node.py hash "the heap remembers"

      - name: Executor pantry
        run: python3 ghot/reference_node.py pantry

      - name: Failure-aware recomposition simulation
        run: python3 ghot/recomposition_sim.py

      - name: Liveness field lifecycle simulation
        run: python3 ghot/liveness_sim.py

      - name: Power field policy simulation
        run: python3 ghot/power_sim.py

      - name: Power-aware BODY probe
        run: |
          GHOT_POWER_SOURCE=battery GHOT_BATTERY_PERCENT=9 GHOT_CHARGING=0 python3 ghot/reference_node.py probe
          GHOT_POWER_SOURCE=solar GHOT_RENEWABLE_SURPLUS=1 GHOT_BATTERY_PERCENT=90 GHOT_CHARGING=1 python3 ghot/reference_node.py power

      - name: Energy-aware scheduling simulation
        run: python3 ghot/energy_sim.py

      - name: Hold queue wake simulation
        run: python3 ghot/wake_sim.py

      - name: Atomic work lease simulation
        run: python3 ghot/lease_sim.py

      - name: reLATTE P-256 fixture conformance
        run: python3 ghot/relatte_identity_sim.py

      - name: Portable lease authority crossing simulation
        run: python3 ghot/portable_lease_sim.py

      - name: Automatic remote dispatch simulation
        run: python3 ghot/auto_dispatch_sim.py

      - name: Authority porch discovery simulation
        run: python3 ghot/authority_discovery_sim.py

      - name: Organ daemon lifecycle simulation
        run: python3 ghot/organ_sim.py

      - name: Bootable organ installation simulation
        run: python3 ghot/install_organ_sim.py

      - name: Morning presence startup simulation
        run: python3 ghot/presence_sim.py

      - name: State migration receipt simulation
        run: python3 ghot/state_migration_sim.py

      - name: Explicit body choice simulation
        run: GHOT_HOME="$(mktemp -d)" python3 ghot/body_choice_sim.py

      - name: Portable state parcel simulation
        run: python3 ghot/state_parcel_sim.py

      - name: Owner-local state merge simulation
        run: python3 ghot/state_merge_sim.py

      - name: Merge-contract pantry simulation
        run: python3 ghot/merge_contract_pantry_sim.py

      - name: Declarative merge plugin simulation
        run: python3 ghot/merge_plugin_sim.py

      - name: Portable merge plugin parcel simulation
        run: python3 ghot/merge_plugin_parcel_sim.py

      - name: Grammar exchange request-offer simulation
        run: python3 ghot/grammar_exchange_sim.py

      - name: Composition gap and want simulation
        run: python3 ghot/composition_want_sim.py

      - name: Curious Doors read-only surface simulation
        run: python3 ghot/curious_doors_sim.py

      - name: Curious Door navigation simulation
        run: python3 ghot/curious_navigation_sim.py

      - name: Typed launch descriptor simulation
        run: python3 ghot/launch_descriptor_sim.py

      - name: One-operation activation ticket simulation
        run: python3 ghot/activation_ticket_sim.py

      - name: Static-OS activation broker ceremony simulation
        run: python3 ghot/activation_broker_sim.py

      - name: Ice Cube pantry grammar conformance
        run: python3 ghot/merge_plugin.py validate examples/merge-plugins/verified-ice-cube.package.json

      - name: Checkout Dogram Ice Cube verifier
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: impl/ice-cube-001
          path: _dogram_ice

      - name: Ice Cube 030 cross-repo simulation
        run: python3 ghot/ice_cube_sim.py --dogram-repo _dogram_ice

      - name: Ice Cube 031 background-organ simulation
        run: python3 ghot/ice_cube_daemon_sim.py --dogram-repo _dogram_ice

      - name: Lightwalker Economy 032 vertical-slice simulation
        run: python3 ghot/lightwalker_economy_sim.py --dogram-repo _dogram_ice

      - name: Checkout Dogram Contribution Field
        uses: actions/checkout@v4
        with:
          repository: the-static-collective/Dogram
          ref: design/contribution-field-001
          path: _dogram_contribution

      - name: Lightwalker Time Assay 033 simulation
        run: |
          python3 ghot/lightwalker_time_assay_sim.py \
            --dogram-ice-repo _dogram_ice \
            --dogram-contribution-repo _dogram_contribution

      - name: Lightwalker Market 034 simulation
        run: |
          python3 ghot/lightwalker_market_sim.py \
            --dogram-ice-repo _dogram_ice \
            --dogram-contribution-repo _dogram_contribution

      - name: Lightwalker Heterogeneous Exchange 035 simulation
        run: |
          python3 ghot/lightwalker_heterogeneous_sim.py \
            --dogram-ice-repo _dogram_ice \
            --dogram-contribution-repo _dogram_contribution

      - name: Lightwalker Labor Writ 036 simulation
        run: python3 ghot/lightwalker_labor_writ_sim.py

      - name: Lightwalker Guild Treasury 037 simulation
        run: python3 ghot/lightwalker_guild_treasury_sim.py

      - name: Lightwalker Guild Authorization 038 simulation
        run: python3 ghot/lightwalker_guild_authorization_sim.py

      - name: Lightwalker Guild 039 simulation
        run: python3 ghot/lightwalker_guild_reservation_sim.py

      - name: Lightwalker Distributed Reservation 040 simulation
        run: python3 ghot/lightwalker_distributed_reservation_sim.py

      - name: Lightwalker Capacity Lease 041 simulation
        run: python3 ghot/lightwalker_capacity_lease_sim.py

      - name: Lightwalker Lease Handoff 042 simulation
        run: python3 ghot/lightwalker_lease_handoff_sim.py

      - name: Lightwalker Lease Lineage 043 simulation
        run: python3 ghot/lightwalker_lease_lineage_sim.py

      - name: Lightwalker Authority Compost 044 simulation
        run: python3 ghot/lightwalker_authority_compost_sim.py

      - name: Lightwalker Authority Metabolism 045 simulation
        run: python3 ghot/lightwalker_authority_metabolism_sim.py

      - name: Lightwalker Metabolic Exchange 046 simulation
        run: python3 ghot/lightwalker_metabolic_exchange_sim.py

      - name: Lightwalker Capacity-Backed Service 047 simulation
        run: python3 ghot/lightwalker_capacity_backed_service_sim.py

      - name: Lightwalker Federated Service 048 simulation
        run: python3 ghot/lightwalker_federated_service_sim.py

      - name: Lightwalker Multi-Source Service 049 simulation
        run: python3 ghot/lightwalker_multi_source_service_sim.py

      - name: Lightwalker Federated Reroute 050 simulation
        run: python3 ghot/lightwalker_federated_reroute_sim.py

      - name: Lightwalker Route Policy 051 simulation
        run: python3 ghot/lightwalker_route_policy_sim.py

      - name: Lightwalker Route Scoring 052 simulation
        run: python3 ghot/lightwalker_route_scoring_sim.py

      - name: Lightwalker Constraint Routing 053 simulation
        run: python3 ghot/lightwalker_constraint_routing_sim.py

      - name: Lightwalker Policy Composition 054 simulation
        run: python3 ghot/lightwalker_policy_composition_sim.py

      - name: Lightwalker Policy Versioning 055 simulation
        run: python3 ghot/lightwalker_policy_versioning_sim.py

      - name: Lightwalker Policy Transition 056 simulation
        run: python3 ghot/lightwalker_policy_transition_sim.py

      - name: Lightwalker Transition Composition 057 simulation
        run: python3 ghot/lightwalker_transition_composition_sim.py
